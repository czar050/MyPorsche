<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Unity Web Player | My Porsche</title>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
            background: #FFFFFF;
        }

        #unity-canvas {
            position: fixed;
            top: 0;
            left: 0;
            display: block;

            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;

            margin: 0;
            padding: 0;
            border: 0;

            background: #FFFFFF;
            outline: none;
        }
    </style>
</head>

<body>
    <canvas id="unity-canvas"
            width="1290"
            height="2796"
            tabindex="-1"></canvas>

    <script src="Build/10.loader.js"></script>

    <script>
        const canvas = document.querySelector("#unity-canvas");

        function resizeCanvas() {
            canvas.style.width = "100vw";
            canvas.style.height = "100vh";

            if (window.visualViewport) {
                canvas.style.height =
                    window.visualViewport.height + "px";
            }
        }

        resizeCanvas();

        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("orientationchange", () => {
            setTimeout(resizeCanvas, 200);
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener(
                "resize",
                resizeCanvas
            );
        }

        createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/10.data.unityweb",
            frameworkUrl: "Build/10.framework.js.unityweb",
            codeUrl: "Build/10.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "My Porsche",
            productVersion: "0.1.0"
        }).then((unityInstance) => {
            resizeCanvas();
        }).catch((message) => {
            alert(message);
        });
    </script>
</body>
</html>
